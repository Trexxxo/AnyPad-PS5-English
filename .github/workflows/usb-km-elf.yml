name: Build PS5 ELF (USB KM diagnostic)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/usb-kbm-diagnostics
    paths:
      - 'src/**'
      - 'ps5.mk'
      - 'Makefile'
      - '.github/workflows/usb-km-elf.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'ps5.mk'
      - 'Makefile'
      - '.github/workflows/usb-km-elf.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install LLVM 18 and host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 make unzip wget xxd

      - name: Download PS5 payload SDK
        run: |
          wget -q --show-progress https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip -O /tmp/ps5-payload-sdk.zip
          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt
          test -x /opt/ps5-payload-sdk/bin/prospero-clang
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> "$GITHUB_ENV"

      # The upstream full host suite includes FreeBSD-only sys/sysctl.h tests.
      # Run the portable subset on Ubuntu; report platform-specific tests separately.
      - name: Run portable host tests
        run: |
          make build/test_usb build/test_crypto
          ./build/test_usb
          ./build/test_crypto

      - name: Build ELF
        run: make ps5

      - name: Check ELF and write SHA256
        run: |
          file dist/*.elf
          sha256sum dist/*.elf > dist/SHA256SUMS

      - name: Upload test payload
        uses: actions/upload-artifact@v4
        with:
          name: anypad-usb-km-diagnostic-elf
          path: |
            dist/*.elf
            dist/SHA256SUMS
          if-no-files-found: error
